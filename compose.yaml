name: firmware-releases

services:
  app:
    build:
      context: .
      target: app
    image: firmware-releases/app
    environment:
      PORT: "8080"
      DATA_DIR: /data
    ports:
      # Host port is configurable: FW_HOST_PORT=9090 docker compose up -d app
      - "${FW_HOST_PORT:-8080}:8080"
    volumes:
      - firmware-data:/data
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: firmware-releases/verify
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
    restart: "no"

volumes:
  firmware-data:
